<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=Cairo:wght@600;700;800&display=swap">
  <style>
    body { margin: 0; background: #17110C; color: #2E2118; font-family: 'Cairo', 'Segoe UI', sans-serif; }
    * { box-sizing: border-box; }
    a { color: #C2593C; } a:hover { color: #9A4229; }
    .dsp { font-family: 'Alexandria', 'Trebuchet MS', sans-serif; }
    @keyframes emb { 0%,100% { opacity: .72; transform: scale(1) } 43% { opacity: 1; transform: scale(1.07) } 71% { opacity: .84; transform: scale(1.02) } }
    .ember { animation: emb 1.6s ease-in-out infinite }
    @keyframes glow { 0%,100% { opacity: .5 } 50% { opacity: .78 } }
    .spill { animation: glow 1.6s ease-in-out infinite }
    @keyframes shim { 0% { transform: translateY(0) scaleX(1); opacity: .3 } 100% { transform: translateY(-26px) scaleX(1.3); opacity: 0 } }
    .h1 { animation: shim 2.6s ease-out infinite }
    .h2 { animation: shim 2.6s ease-out .9s infinite }
    .h3 { animation: shim 2.6s ease-out 1.8s infinite }
    @keyframes lean { 0%,100% { transform: scaleX(-1) translateY(0) rotate(0deg) } 50% { transform: scaleX(-1) translateY(-3px) rotate(-1deg) } }
    .jeddo { animation: lean 3.4s ease-in-out infinite; transform-origin: 50% 90% }
    @keyframes sheen { 0% { transform: translateX(-130%) skewX(-18deg) } 55%,100% { transform: translateX(320%) skewX(-18deg) } }
    .sheen { animation: sheen 3.4s ease-in-out infinite }
    @keyframes hb { 0%,100% { transform: scale(1) } 22% { transform: scale(1.14) } 44% { transform: scale(1) } }
    .beat { animation: hb 1.5s ease-in-out infinite; transform-origin: 50% 60% }
  </style>
</helmet>

<script data-dc-script data-props='{"ovenLevel":{"editor":"enum","options":["Clay saj","Gas furn","Stone furn","Pro deck"],"default":"Clay saj","section":"Upgrades"},"sajSlots":{"editor":"int","min":2,"max":3,"default":2,"section":"Upgrades"},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      coins: 262, day: 3, timeLeft: 47,
      prep: null,
      slots: [{ item: null }, { item: null }, { item: null }],
      ready: [],
      drops: [{ id: 1, amt: 14, life: 3.4, max: 4, slot: 1 }],
      queue: [
        { id: 2, name: 'Rana', want: 'zaatar', pat: 0.74 },
        { id: 3, name: 'Georges', want: 'cheese', pat: 0.9 },
        { id: 4, name: 'Nour', want: 'sbanekh', pat: 1 }
      ],
      hint: 'Take dough from the bowl',
      nextId: 20
    };
  }

  get recipes() {
    return {
      zaatar: { bake: 6, perfect: 1.4, grace: 0.8, price: 8, label: 'Zaatar', disc: '#4E6B2E', dark: '#3C5522', clip: 'none' },
      cheese: { bake: 7.5, perfect: 1.5, grace: 1.1, price: 14, label: 'Cheese', disc: '#EFD79B', dark: '#D9B45E', clip: 'none' },
      sbanekh: { bake: 7, perfect: 1.3, grace: 0.9, price: 12, label: 'Sbanekh', disc: '#4A7038', dark: '#335024', clip: 'polygon(50% 2%, 98% 94%, 2% 94%)' },
      pizza: { bake: 6.6, perfect: 1.35, grace: 0.9, price: 16, label: 'Mini pizza', disc: '#D4643F', dark: '#A8452D', clip: 'none' }
    };
  }

  oven() {
    const names = ['Clay saj', 'Gas furn', 'Stone furn', 'Pro deck'];
    let i = names.indexOf(this.props.ovenLevel);
    if (i < 0) i = 0;
    return { name: names[i], bake: [1, 0.87, 0.73, 0.6][i], win: [1, 1, 1.07, 1.14][i] };
  }

  recipe(topping) {
    const base = this.recipes[topping];
    const o = this.oven();
    const bake = base.bake * o.bake;
    return { bake: bake, perfect: base.perfect * o.win, total: bake + base.grace, price: base.price, label: base.label, disc: base.disc };
  }

  componentDidMount() { this.timer = setInterval(() => this.tick(), 100); }
  componentWillUnmount() { clearInterval(this.timer); }

  tick() {
    const s = this.state;
    const slots = s.slots.map((sl) => (sl.item ? { item: { topping: sl.item.topping, t: sl.item.t + 0.1 } } : sl));
    const drops = s.drops.map((d) => ({ id: d.id, amt: d.amt, life: d.life - 0.1, max: d.max, slot: d.slot })).filter((d) => d.life > 0);
    const queue = s.queue.map((c, i) => ({ id: c.id, name: c.name, want: c.want, pat: Math.max(0.05, c.pat - (i === 0 ? 0.0022 : 0.0009)) }));
    this.setState({ slots: slots, drops: drops, queue: queue, timeLeft: Math.max(0, s.timeLeft - 0.1) });
  }

  newCustomer() {
    const names = ['Jad', 'Maya', 'Karim', 'Layal', 'Ziad', 'Hala'];
    const id = this.state.nextId + 1;
    const pool = ['zaatar', 'cheese', 'sbanekh', 'zaatar', 'cheese'];
    return { id: id, name: names[id % names.length], want: pool[id % pool.length], pat: 1 };
  }

  takeDough() {
    if (this.state.prep) { this.setState({ hint: 'One on the board already' }); return; }
    this.setState({ prep: { stage: 'flat', topping: null }, hint: 'Spread zaatar or cheese' });
  }

  tapPrep() {
    const p = this.state.prep;
    if (!p) { this.setState({ hint: 'Take dough from the bowl' }); return; }
    if (p.stage === 'flat') { this.setState({ hint: 'It needs a topping first' }); return; }
    this.setState({ hint: 'Into the furn with it' });
  }

  tapTopping(t) {
    const p = this.state.prep;
    if (!p) { this.setState({ hint: 'Take dough from the bowl first' }); return; }
    if (p.stage !== 'flat') { this.setState({ hint: 'That one is already topped' }); return; }
    this.setState({ prep: { stage: 'topped', topping: t }, hint: 'Into the furn with it' });
  }

  tapSlot(i) {
    const s = this.state;
    const slots = s.slots.map((x) => ({ item: x.item }));
    const sl = slots[i];
    if (sl.item) {
      const r = this.recipe(sl.item.topping);
      const t = sl.item.t;
      let q = 'raw';
      if (t >= r.bake - r.perfect && t < r.bake) q = 'perfect';
      else if (t >= r.bake && t < r.total) q = 'done';
      else if (t >= r.total) q = 'burnt';
      slots[i] = { item: null };
      const ready = s.ready.concat([{ id: s.nextId, topping: sl.item.topping, q: q, wrapped: false }]).slice(-3);
      const msg = q === 'perfect' ? 'Perfect — roll it in paper' : q === 'raw' ? 'Too pale, but wrap it' : q === 'done' ? 'A touch dark — wrap it' : 'Burnt. Bin it';
      this.setState({ slots: slots, ready: ready, nextId: s.nextId + 1, hint: msg });
      return;
    }
    const p = s.prep;
    if (!p || p.stage !== 'topped') { this.setState({ hint: 'Nothing topped and ready to bake' }); return; }
    slots[i] = { item: { topping: p.topping, t: 0 } };
    this.setState({ slots: slots, prep: null, hint: 'Pull it inside the green band' });
  }

  tapReady(i) {
    const s = this.state;
    const item = s.ready[i];
    if (!item) return;
    if (!item.wrapped) {
      const ready = s.ready.map((x, j) => (j === i ? { id: x.id, topping: x.topping, q: x.q, wrapped: true } : x));
      this.setState({ ready: ready, hint: 'Wrapped — hand it over' });
      return;
    }
    const cust = s.queue[0];
    if (!cust) return;
    const r = this.recipe(item.topping);
    let mult = item.q === 'perfect' ? 1.25 : item.q === 'done' ? 1 : item.q === 'raw' ? 0.5 : 0.25;
    const match = item.topping === cust.want;
    if (!match) mult = mult * 0.4;
    const amt = Math.max(1, Math.round(r.price * mult * (0.8 + cust.pat * 0.4)));
    const ready = s.ready.filter((x, j) => j !== i);
    const queue = s.queue.slice(1).concat([this.newCustomer()]);
    const drops = s.drops.concat([{ id: s.nextId, amt: amt, life: 4, max: 4, slot: 0 }]);
    this.setState({ ready: ready, queue: queue, drops: drops, nextId: s.nextId + 2, hint: match ? 'Order matched — take the money' : 'Wrong topping, they paid less' });
  }

  trash() {
    const s = this.state;
    if (s.ready.length) { this.setState({ ready: s.ready.slice(0, -1), hint: 'Binned it' }); return; }
    if (s.prep) { this.setState({ prep: null, hint: 'Binned it — start again' }); return; }
    this.setState({ hint: 'Nothing to bin' });
  }

  collect(id) {
    const s = this.state;
    const d = s.drops.filter((x) => x.id === id)[0];
    if (!d) return;
    this.setState({ coins: s.coins + d.amt, drops: s.drops.filter((x) => x.id !== id), hint: 'Keep the line moving' });
  }

  discColorFor(topping, frac) {
    const r = this.recipes[topping];
    if (frac < 0.45) return '#E8D3A6';
    if (frac < 0.8) return r.disc;
    if (frac < 1) return r.dark;
    return '#6F4B2C';
  }

  renderVals() {
    const s = this.state;
    const n = Math.max(2, Math.min(3, this.props.sajSlots || 2));
    const gap = n === 2 ? 24 : 7;
    const startX = n === 2 ? 28 : 13;

    const blister = 'radial-gradient(circle at 30% 26%, rgba(255,240,200,.34) 0 12%, rgba(0,0,0,0) 13%), radial-gradient(circle at 68% 40%, rgba(0,0,0,.24) 0 9%, rgba(0,0,0,0) 10%), radial-gradient(circle at 44% 72%, rgba(0,0,0,.2) 0 11%, rgba(0,0,0,0) 12%), radial-gradient(circle at 76% 74%, rgba(255,240,200,.22) 0 8%, rgba(0,0,0,0) 9%)';

    const slotViews = [];
    let sajLabel = 'Furn', sajColor = '#7A4A2A';
    for (let i = 0; i < n; i++) {
      const sl = s.slots[i];
      const left = startX + i * (54 + gap) + 'px';
      if (!sl.item) {
        slotViews.push({ left: left, arc: 'transparent', ring: 'rgba(255,215,170,.10)', disc: 'transparent', discBorder: '2px dashed rgba(255,210,160,.36)', discShadow: 'none', blister: 'none', clip: 'none', onTap: () => this.tapSlot(i) });
        continue;
      }
      const r = this.recipe(sl.item.topping);
      const t = sl.item.t;
      const deg = Math.min(360, (t / r.total) * 360);
      const pStart = ((r.bake - r.perfect) / r.total) * 360;
      const pEnd = (r.bake / r.total) * 360;
      let col = '#E0A339', label = 'Baking', lc = '#8A5A12';
      if (t >= r.bake - r.perfect && t < r.bake) { col = '#7CA646'; label = 'Perfect!'; lc = '#3F6420'; }
      else if (t >= r.bake && t < r.total) { col = '#E08A24'; label = 'Careful'; lc = '#A8501F'; }
      else if (t >= r.total) { col = '#6F4B2C'; label = 'Burnt'; lc = '#6F4B2C'; }
      if (label !== 'Baking' || sajLabel === 'Furn') { sajLabel = label; sajColor = lc; }
      slotViews.push({
        left: left,
        arc: 'conic-gradient(from -90deg, rgba(0,0,0,0) 0deg ' + pStart + 'deg, #B5D086 ' + pStart + 'deg ' + pEnd + 'deg, rgba(0,0,0,0) ' + pEnd + 'deg 360deg)',
        ring: 'conic-gradient(from -90deg, ' + col + ' 0deg ' + deg + 'deg, rgba(255,215,170,.14) ' + deg + 'deg 360deg)',
        disc: this.discColorFor(sl.item.topping, Math.min(1.06, t / r.total)),
        discBorder: '0 solid transparent',
        discShadow: 'inset 0 -4px 7px rgba(50,28,8,.5), 0 0 12px rgba(255,150,50,.4)',
        blister: blister,
        clip: this.recipes[sl.item.topping].clip,
        onTap: () => this.tapSlot(i)
      });
    }

    const customers = s.queue.slice(0, 3).map((c, i) => {
      const wrapped = i === 0 && s.ready.filter((x) => x.wrapped).length > 0;
      const kind = c.id % 3;
      return {
        left: 222 + i * 116 + 'px',
        isA: kind === 0, isB: kind === 1, isC: kind === 2,
        mouth: c.pat > 0.45 ? 'M38 82c5 6 15 6 20 0' : 'M38 86c5-6 15-6 20 0',
        discColor: this.recipes[c.want].disc,
        clip: this.recipes[c.want].clip,
        sideColor: '#4A7038',
        heart: c.pat > 0.55 ? '#D4643F' : c.pat > 0.28 ? '#E0A339' : '#8F8C88',
        check1: wrapped ? '1' : '0.12',
        check2: '0.12'
      };
    });

    const p = s.prep;
    const prep = !p
      ? { size: '0px', fill: 'transparent', shadow: 'none', border: '0 solid transparent', clip: 'none' }
      : p.stage === 'flat'
        ? { size: '60px', fill: 'radial-gradient(circle at 34% 28%, #F6E4BC, #E2C795)', shadow: 'inset 0 0 0 3px #DCBE8A, 0 3px 5px rgba(0,0,0,.28)', border: '3px solid #2A1B12', clip: 'none' }
        : { size: '60px', fill: 'radial-gradient(circle at 34% 28%, ' + this.recipes[p.topping].disc + ', ' + this.recipes[p.topping].dark + ')', shadow: 'inset 0 0 0 4px #EDD7A9, 0 3px 5px rgba(0,0,0,.28)', border: '3px solid #2A1B12', clip: this.recipes[p.topping].clip };

    const trays = [
      { label: 'Pizza', w: '92px', fill: 'linear-gradient(180deg, #9DA2A8, #6E747A)', left: '398px', opacity: '0.5', onTap: () => this.setState({ hint: 'Mini pizza unlocks on day 6' }) },
      { label: 'Sbanekh', w: '92px', fill: 'radial-gradient(circle at 30% 26%, #5F8C42, #335024 66%, #26401B 100%)', left: '498px', opacity: '1', onTap: () => this.tapTopping('sbanekh') },
      { label: 'Zaatar', w: '92px', fill: 'radial-gradient(circle at 30% 26%, #6A8C3E, #3C5522 68%, #2E421A 100%)', left: '598px', opacity: '1', onTap: () => this.tapTopping('zaatar') },
      { label: 'Cheese', w: '92px', fill: 'radial-gradient(circle at 30% 26%, #FAEEC2, #DFC177 68%, #C9A75C 100%)', left: '698px', opacity: '1', onTap: () => this.tapTopping('cheese') }
    ];

    const ready = s.ready.map((rd, i) => ({
      isWrapped: rd.wrapped,
      isBaked: !rd.wrapped,
      clip: this.recipes[rd.topping].clip,
      fill: this.discColorFor(rd.topping, rd.q === 'raw' ? 0.5 : rd.q === 'burnt' ? 1.02 : 0.85),
      edge: rd.q === 'perfect' ? '#4E7A2E' : rd.q === 'done' ? '#B86A1E' : rd.q === 'raw' ? '#B5A176' : '#2A1B12',
      onTap: () => this.tapReady(i)
    }));

    const drops = s.drops.map((d) => {
      const deg = (d.life / d.max) * 360;
      return {
        amt: d.amt,
        left: 244 + (d.slot % 3) * 116 + 'px',
        ring: 'conic-gradient(from -90deg, #D4643F 0deg ' + deg + 'deg, rgba(42,27,18,.4) ' + deg + 'deg 360deg)',
        onTap: () => this.collect(d.id)
      };
    });

    const secs = Math.floor(s.timeLeft);
    const timeText = Math.floor(secs / 60) + ':' + (secs % 60 < 10 ? '0' : '') + (secs % 60);

    return {
      coins: s.coins, day: s.day, timeText: timeText,
      timerInk: s.timeLeft < 15 ? '#FF7A5C' : '#8AECAE',
      unlockW: '73%', hint: s.hint,
      customers: customers, slotViews: slotViews,
      sajLabel: sajLabel, sajColor: sajColor,
      trays: trays, prep: prep, ready: ready,
      readyHint: s.ready.length ? '' : 'nothing baked',
      drops: drops,
      onDough: () => this.takeDough(),
      onPrep: () => this.tapPrep(),
      onTrash: () => this.trash()
    };
  }
}
</script>
</body>
</html>

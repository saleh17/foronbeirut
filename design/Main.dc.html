<script data-dc-script data-props='{"ovenLevel":{"editor":"enum","options":["Clay saj","Gas furn","Stone furn","Pro deck"],"default":"Clay saj","section":"Upgrades"},"sajSlots":{"editor":"int","min":2,"max":3,"default":2,"section":"Upgrades"},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      coins: 262,
      day: 3,
      timeLeft: 47,
      prep: null,
      slots: [{ item: null }, { item: null }, { item: null }],
      ready: [],
      drops: [{ id: 1, amt: 14, life: 3.4, max: 4, slot: 1 }],
      queue: [
        { id: 2, name: 'Rana', want: 'zaatar', pat: 0.74 },
        { id: 3, name: 'Georges', want: 'cheese', pat: 0.9 },
        { id: 4, name: 'Nour', want: 'zaatar', pat: 1 }
      ],
      hint: 'Take a ball of dough',
      nextId: 20
    };
  }

  get recipes() {
    return {
      zaatar: { bake: 6, perfect: 1.4, grace: 0.8, price: 8, label: 'Zaatar', disc: '#4E6B2E' },
      cheese: { bake: 7.5, perfect: 1.5, grace: 1.1, price: 14, label: 'Cheese', disc: '#EFD79B' }
    };
  }

  oven() {
    const names = ['Clay saj', 'Gas furn', 'Stone furn', 'Pro deck'];
    let i = names.indexOf(this.props.ovenLevel);
    if (i < 0) i = 0;
    return { name: names[i], bake: [1, 0.87, 0.73, 0.6][i], win: [1, 1, 1.07, 1.14][i] };
  }

  recipe(topping) {
    const base = this.recipes[topping];
    const o = this.oven();
    const bake = base.bake * o.bake;
    return { bake: bake, perfect: base.perfect * o.win, total: bake + base.grace, price: base.price, label: base.label, disc: base.disc };
  }

  componentDidMount() { this.timer = setInterval(() => this.tick(), 100); }
  componentWillUnmount() { clearInterval(this.timer); }

  tick() {
    const s = this.state;
    const slots = s.slots.map((sl) => (sl.item ? { item: { topping: sl.item.topping, t: sl.item.t + 0.1 } } : sl));
    const drops = s.drops.map((d) => ({ id: d.id, amt: d.amt, life: d.life - 0.1, max: d.max, slot: d.slot })).filter((d) => d.life > 0);
    const queue = s.queue.map((c, i) => ({ id: c.id, name: c.name, want: c.want, pat: Math.max(0.05, c.pat - (i === 0 ? 0.0022 : 0.0009)) }));
    this.setState({ slots: slots, drops: drops, queue: queue, timeLeft: Math.max(0, s.timeLeft - 0.1) });
  }

  newCustomer() {
    const names = ['Jad', 'Maya', 'Karim', 'Layal', 'Ziad', 'Hala'];
    const id = this.state.nextId + 1;
    return { id: id, name: names[id % names.length], want: id % 3 === 0 ? 'cheese' : 'zaatar', pat: 1 };
  }

  tapDough() {
    if (this.state.prep) { this.setState({ hint: 'Finish the one on the board first' }); return; }
    this.setState({ prep: { stage: 'ball', topping: null }, hint: 'Press the ball flat' });
  }

  tapPrep() {
    const p = this.state.prep;
    if (!p) { this.setState({ hint: 'Take a ball of dough' }); return; }
    if (p.stage === 'ball') this.setState({ prep: { stage: 'flat', topping: null }, hint: 'Spread zaatar or cheese' });
  }

  tapTopping(t) {
    const p = this.state.prep;
    if (!p || p.stage !== 'flat') { this.setState({ hint: 'Flatten a ball of dough first' }); return; }
    this.setState({ prep: { stage: 'topped', topping: t }, hint: 'On the saj with it' });
  }

  tapSlot(i) {
    const s = this.state;
    const slots = s.slots.map((x) => ({ item: x.item }));
    const sl = slots[i];
    if (sl.item) {
      const r = this.recipe(sl.item.topping);
      const t = sl.item.t;
      let q = 'raw';
      if (t >= r.bake - r.perfect && t < r.bake) q = 'perfect';
      else if (t >= r.bake && t < r.total) q = 'done';
      else if (t >= r.total) q = 'burnt';
      slots[i] = { item: null };
      const ready = s.ready.concat([{ id: s.nextId, topping: sl.item.topping, q: q }]).slice(-3);
      const msg = q === 'perfect' ? 'Perfect — hand it over' : q === 'raw' ? 'Too early, it is still pale' : q === 'done' ? 'A touch dark, still sells' : 'Burnt — bin it';
      this.setState({ slots: slots, ready: ready, nextId: s.nextId + 1, hint: msg });
      return;
    }
    const p = s.prep;
    if (!p || p.stage !== 'topped') { this.setState({ hint: 'Nothing topped and ready to bake' }); return; }
    slots[i] = { item: { topping: p.topping, t: 0 } };
    this.setState({ slots: slots, prep: null, hint: 'Pull it inside the green band' });
  }

  tapReady(i) {
    const s = this.state;
    const item = s.ready[i];
    const cust = s.queue[0];
    if (!item || !cust) return;
    const r = this.recipe(item.topping);
    let mult = item.q === 'perfect' ? 1.25 : item.q === 'done' ? 1 : item.q === 'raw' ? 0.5 : 0.25;
    const match = item.topping === cust.want;
    if (!match) mult = mult * 0.4;
    const amt = Math.max(1, Math.round(r.price * mult * (0.8 + cust.pat * 0.4)));
    const ready = s.ready.filter((x, j) => j !== i);
    const queue = s.queue.slice(1).concat([this.newCustomer()]);
    const drops = s.drops.concat([{ id: s.nextId, amt: amt, life: 4, max: 4, slot: 0 }]);
    this.setState({ ready: ready, queue: queue, drops: drops, nextId: s.nextId + 2, hint: match ? 'Order matched — take the money' : 'Wrong topping, they paid less' });
  }

  trash() {
    const s = this.state;
    if (s.ready.length) { this.setState({ ready: s.ready.slice(0, -1), hint: 'Binned it' }); return; }
    if (s.prep) { this.setState({ prep: null, hint: 'Binned it — start again' }); return; }
    this.setState({ hint: 'Nothing to bin' });
  }

  collect(id) {
    const s = this.state;
    const d = s.drops.filter((x) => x.id === id)[0];
    if (!d) return;
    this.setState({ coins: s.coins + d.amt, drops: s.drops.filter((x) => x.id !== id), hint: 'Keep the line moving' });
  }

  discColorFor(topping, frac) {
    const r = this.recipes[topping];
    if (frac < 0.45) return '#E8D3A6';
    if (frac < 0.8) return r.disc;
    if (frac < 1) return topping === 'zaatar' ? '#3C5522' : '#D9B45E';
    return '#6F4B2C';
  }

  renderVals() {
    const s = this.state;
    const n = Math.max(2, Math.min(3, this.props.sajSlots || 2));
    const gap = n === 2 ? 30 : 8;
    const startX = n === 2 ? 26 : 12;

    const slotViews = [];
    let sajLabel = 'Saj', sajColor = '#4A4038';
    for (let i = 0; i < n; i++) {
      const sl = s.slots[i];
      const left = startX + i * (58 + gap) + 'px';
      if (!sl.item) {
        slotViews.push({ left: left, arc: 'transparent', ring: '#4A4038', disc: 'transparent', discBorder: '2px dashed #6E6259', discShadow: 'none', onTap: () => this.tapSlot(i) });
        continue;
      }
      const r = this.recipe(sl.item.topping);
      const t = sl.item.t;
      const deg = Math.min(360, (t / r.total) * 360);
      const pStart = ((r.bake - r.perfect) / r.total) * 360;
      const pEnd = (r.bake / r.total) * 360;
      let col = '#E0A339', label = 'Baking', lc = '#8A5A12';
      if (t >= r.bake - r.perfect && t < r.bake) { col = '#6E9440'; label = 'Perfect!'; lc = '#3F6420'; }
      else if (t >= r.bake && t < r.total) { col = '#D98324'; label = 'Careful'; lc = '#A8501F'; }
      else if (t >= r.total) { col = '#6F4B2C'; label = 'Burnt'; lc = '#6F4B2C'; }
      if (label !== 'Baking' || sajLabel === 'Saj') { sajLabel = label; sajColor = lc; }
      slotViews.push({
        left: left,
        arc: 'conic-gradient(from -90deg, rgba(0,0,0,0) 0deg ' + pStart + 'deg, #A8C57A ' + pStart + 'deg ' + pEnd + 'deg, rgba(0,0,0,0) ' + pEnd + 'deg 360deg)',
        ring: 'conic-gradient(from -90deg, ' + col + ' 0deg ' + deg + 'deg, #55493F ' + deg + 'deg 360deg)',
        disc: this.discColorFor(sl.item.topping, Math.min(1.06, t / r.total)),
        discBorder: '0 solid transparent',
        discShadow: 'inset 0 -3px 6px rgba(60,40,15,0.4)',
        onTap: () => this.tapSlot(i)
      });
    }

    const skins = ['#E8C39A', '#C08A5E', '#EBD0AE'];
    const shirts = ['#C2593C', '#5F7D3C', '#4E6E8F'];
    const hairs = [
      'M11 40c0-19 11-28 25-28s25 9 25 28c0 0-9-9-25-9s-25 9-25 9z',
      'M11 34c5-13 14-20 25-20s20 7 25 20c0 0-10-6-25-6s-25 6-25 6z',
      'M12 38c0-16 10-25 24-25s24 9 24 25c-4-11-13-14-24-14s-20 3-24 14z'
    ];
    const customers = s.queue.slice(0, 3).map((c, i) => {
      const done = i === 0 && s.ready.length > 0;
      return {
        left: 316 + i * 158 + 'px',
        skin: skins[c.id % 3],
        shirt: shirts[c.id % 3],
        hairColor: ['#3B2A1C', '#4A3421', '#7A6A58'][c.id % 3],
        hair: hairs[c.id % 3],
        mouth: c.pat > 0.45 ? 'M27 56c5 5 14 5 19 0' : 'M27 58c5-5 14-5 19 0',
        discColor: this.recipes[c.want].disc,
        heart: c.pat > 0.55 ? '#C2593C' : c.pat > 0.28 ? '#E0A339' : '#8A8A8A',
        check1: done ? '1' : '0.12',
        check2: '0.12'
      };
    });

    const p = s.prep;
    const prep = !p
      ? { size: '0px', fill: 'transparent', shadow: 'none', border: '0 solid transparent' }
      : p.stage === 'ball'
        ? { size: '34px', fill: '#EFDCB2', shadow: 'inset 0 -4px 7px rgba(120,85,40,0.28)', border: '3px solid #3A2E24' }
        : p.stage === 'flat'
          ? { size: '58px', fill: '#EDD7A9', shadow: 'inset 0 0 0 3px #E2C795', border: '3px solid #3A2E24' }
          : { size: '58px', fill: this.recipes[p.topping].disc, shadow: 'inset 0 0 0 4px #EDD7A9', border: '3px solid #3A2E24' };

    const trays = [
      { label: 'Dough', fill: 'radial-gradient(circle at 30% 30%, #F3E2BC, #E2CB9C)', left: '316px', opacity: '1', onTap: () => this.tapDough() },
      { label: 'Zaatar', fill: 'radial-gradient(circle at 30% 30%, #5C7C36, #3C5522)', left: '428px', opacity: '1', onTap: () => this.tapTopping('zaatar') },
      { label: 'Cheese', fill: 'radial-gradient(circle at 30% 30%, #F5E2AC, #DFC177)', left: '540px', opacity: '1', onTap: () => this.tapTopping('cheese') },
      { label: 'Extras', fill: 'linear-gradient(180deg, #9DA2A8, #7E848A)', left: '652px', opacity: '0.55', onTap: () => this.setState({ hint: 'Extras unlock on day 5' }) }
    ];

    const ready = s.ready.map((rd, i) => ({
      fill: this.discColorFor(rd.topping, rd.q === 'raw' ? 0.5 : rd.q === 'burnt' ? 1.02 : 0.85),
      edge: rd.q === 'perfect' ? '#4E7A2E' : rd.q === 'done' ? '#B86A1E' : rd.q === 'raw' ? '#B5A176' : '#3A2E24',
      onTap: () => this.tapReady(i)
    }));

    const drops = s.drops.map((d) => {
      const deg = (d.life / d.max) * 360;
      return {
        amt: d.amt,
        left: 340 + (d.slot % 3) * 158 + 'px',
        ring: 'conic-gradient(from -90deg, #C2593C 0deg ' + deg + 'deg, rgba(58,46,36,0.35) ' + deg + 'deg 360deg)',
        onTap: () => this.collect(d.id)
      };
    });

    const secs = Math.floor(s.timeLeft);
    const timeText = Math.floor(secs / 60) + ':' + (secs % 60 < 10 ? '0' : '') + (secs % 60);

    return {
      coins: s.coins,
      day: s.day,
      timeText: timeText,
      timerInk: s.timeLeft < 15 ? '#E8654A' : '#7FE0A0',
      unlockW: '73%',
      hint: s.hint,
      customers: customers,
      slotViews: slotViews,
      sajLabel: sajLabel,
      sajColor: sajColor,
      trays: trays,
      prep: prep,
      ready: ready,
      readyHint: s.ready.length ? '' : 'nothing baked',
      drops: drops,
      onPrep: () => this.tapPrep(),
      onTrash: () => this.trash()
    };
  }
}
</script>
</body>
</html>
